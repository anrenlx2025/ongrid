$:
  tag_push:
    - docker:
        image: golang:1.25.11-bookworm
      stages:
        - name: Build direct Edge attachments
          script: |
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends curl xz-utils unzip
            version=$(tr -d '[:space:]' < VERSION)
            deps_tag=$(make --no-print-directory edge-deps-tag)
            case "$CNB_BRANCH" in
              "$deps_tag") make build-edge-deps-attachments ;;
              v*)
                test "$CNB_BRANCH" = "$version" || {
                  echo "VERSION ($version) must match release tag ($CNB_BRANCH)" >&2
                  exit 2
                }
                make verify-edge-deps-release
                make build-edge-version-attachments
                ;;
              *)
                echo "unsupported Edge attachment tag: $CNB_BRANCH" >&2
                exit 2
                ;;
            esac
        - name: Create CNB Release
          type: git:release
          options:
            overlying: true
            title: Edge assets $CNB_BRANCH
            description: Checksum-verified direct downloads for Ongrid Edge installation.
            latest: false
        - name: Upload CNB Release attachments
          image: cnbcool/attachments@sha256:37c2d53fed9accee6ea0a509a05a4d05e4b36af37d5319451c2284e287b9e935
          settings:
            attachments:
              - ./dist/out/edge-attachments/*
